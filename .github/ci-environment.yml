# The conda environment for the CI jobs that need parallelproj 2, which is only on conda-forge.
# GitHub's hosted runners have no GPU, so the CPU builds are pinned; the same file works on a laptop.
name: pytomography-ci
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pytorch=*=cpu_*
  - libparallelproj=2.0.*=cpu_*
  - parallelproj-core=2.0.*
  - numba  # from conda-forge, so that it matches conda's numpy; pip would install its own
  - pip
