name: Tutorial data links

# Checks that every download in src/pytomography/datasets/registry.py is still where the registry says: each file has
# its pinned size, each zip_range index its pinned checksum, and each IDC series is unchanged. A failure means a record,
# mirror or series has moved or changed, and the registry needs updating. Runs once a week, and on pull requests that
# change the registry.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - src/pytomography/datasets/**
      - src/pytomography/tests/test_datasets_links.py
      - .github/workflows/data-links.yml

jobs:
  links:
    name: Every download in the registry is where it should be
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTomography with the test extras, and idc-index for the IDC series
        run: pip install -e ".[test]" idc-index
      - name: Check every download
        run: PYTOMOGRAPHY_NETWORK_TESTS=1 pytest -m network -ra
