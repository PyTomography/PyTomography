name: GPU

# Every test on an NVIDIA GPU, on a machine of our own (a self-hosted runner labelled "gpu").
# It only ever runs code a maintainer has already approved:
#   merge_group        when a pull request enters the merge queue; it merges only if this passes
#   schedule           every night on main
#   workflow_dispatch  on demand, by a maintainer
# It never runs on a pull request's own pushes, so unreviewed code from a fork never reaches the GPU machine.
#
# One-time setup on the GPU machine: a conda environment with PyTorch (CUDA) and parallelproj 2 from conda-forge,
# the tutorial data with PYTOMOGRAPHY_DATA pointing at it, and the GitHub runner registered with the label "gpu",
# running as its own low-privilege user. The runner takes one job at a time.

on:
  merge_group:
  schedule:
    - cron: "0 9 * * *"  # 02:00 Pacific
  workflow_dispatch:

jobs:
  gpu:
    name: Full test suite on a GPU
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: A fresh environment for this commit, on top of the runner's CUDA environment
        run: |
          python -m venv --system-site-packages .ci-venv
          PY=.ci-venv/bin/python; [ -x "$PY" ] || PY=.ci-venv/Scripts/python.exe
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install -e ".[test]" psutil
      - name: Check the GPU and parallelproj 2 are there, so nothing skips silently
        run: |
          "$PY" -c "import torch, parallelproj_core; assert torch.cuda.is_available(), 'no CUDA'; print(torch.cuda.get_device_name(0))"
      - name: Every test, including the CUDA and data tests, without taking the machine's memory
        run: |
          "$PY" .github/run_capped.py --max-gb 24 --min-free-gb 16 -- "$PY" -m pytest -ra
