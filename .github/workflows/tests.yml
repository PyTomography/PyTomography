name: Tests

# Every pull request runs every test that doesn't need a GPU, on GitHub's own runners:
#   pip       the install most users have (no parallelproj 2): Linux, macOS, Windows x Python 3.10 to 3.13
#   conda     adds parallelproj 2 (only on conda-forge), so the PET, CT and scatter projector tests run too
#   data      the regression tests on tutorial data, downloaded from Zenodo once and then cached
#   examples  the plain-script versions in examples/ match the tutorial notebooks
# Tests that need CUDA skip themselves here, so merges never wait for a GPU. gpu.yml runs everything on a GPU, once a
# GPU runner is set up.

on:
  pull_request:
  merge_group:  # the merge queue runs these again on the exact commit that will land on main
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip:
    name: pip · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PyTorch (CPU)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
      - name: Install PyTomography with the test extras
        run: pip install -e ".[test]"
      - name: Run tests (no GPU, no tutorial data)
        run: pytest -m "not gpu and not data" -n auto -ra

  conda:
    name: parallelproj 2 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true
      - name: Install PyTomography with the test extras
        run: pip install -e ".[test]"
      - name: Check parallelproj 2 loads, so its tests run instead of skipping
        run: python -c "import parallelproj_core; print('parallelproj_core loaded')"
      - name: Run tests (no GPU, no tutorial data)
        run: pytest -m "not gpu and not data" -n auto -ra

  data:
    name: Regression tests on tutorial data
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true
      - name: Install PyTomography with the test extras
        run: pip install -e ".[test]"
      - name: Restore the test data
        uses: actions/cache@v4
        with:
          path: ~/pytomography_data
          key: tutorial-data-zenodo-15314460-${{ hashFiles('.github/fetch_test_data.py') }}
      - name: Download the test data if it was not cached
        run: python .github/fetch_test_data.py ~/pytomography_data
      - name: Run the data tests
        run: PYTOMOGRAPHY_DATA=$HOME/pytomography_data pytest -m data -ra

  examples:
    name: Example scripts match the notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check examples/ against docs/source/notebooks
        if: ${{ hashFiles('docs/tools/export_scripts.py') != '' }}
        run: |
          pip install pyyaml
          python docs/tools/export_scripts.py --check
