name: Release

# Publishes to PyPI when a version tag (e.g. v4.0.0) is pushed.
# Uses PyPI trusted publishing: on pypi.org, under the pytomography project's Publishing settings, add a
# GitHub publisher for PyTomography/PyTomography with workflow "release.yml" and environment "pypi".
# Releases are tags on main (CONTRIBUTING.md): a tag on any other commit is not published. Only admins can create v*
# tags, and nobody can move or delete one (the repository's tag ruleset).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag the release merge commit on main."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
