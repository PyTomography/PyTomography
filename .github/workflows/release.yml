name: Release

# Publishes to PyPI when a version tag (e.g. v4.0.0) is pushed.
# Releases are tags on main (CONTRIBUTING.md): a tag on any other commit is not published. Only admins can create v*
# tags, and nobody can move or delete one (the repository's tag ruleset), so a failed release run would use up its
# version. A pull request that changes this workflow or pyproject.toml therefore runs the same build and check first,
# without publishing anything.
# Publishing uses the repository secret PYPI_API_TOKEN. To use PyPI trusted publishing instead: on pypi.org, under the
# pytomography project's Publishing settings, add a GitHub publisher for PyTomography/PyTomography with workflow
# "release.yml" and environment "pypi"; then give the publish job `environment: pypi` and
# `permissions: {id-token: write}`, and remove its `password`.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "pyproject.toml"]

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag the release merge commit on main."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the version in pyproject.toml
        if: github.event_name == 'push'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml's version $VERSION: the tag must be v$VERSION."
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  check:
    name: Install the wheel and import it
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the package metadata
        run: |
          pip install twine
          twine check dist/*
      - name: Install the wheel, with PyTorch for the CPU, and import it
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import pytomography, pytomography.io, pytomography.datasets; print('pytomography', pytomography.__version__)"

  publish:
    name: Publish to PyPI
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
