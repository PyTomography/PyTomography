# Work we would like contributors to take on. Rendered on contributing/feature-board.md.
# Each item becomes a GitHub issue labelled `feature-board`; keep the two in sync.
#
#   level:  good-first | intermediate | advanced | research
#   area:   IO | SPECT | PET | CT | Algorithms | Performance | Docs | Research
#   issue:  GitHub issue number, or "new" until one is opened
#
# Paths in `start` are relative to src/pytomography/. Datasets are the keys of pytomography.datasets.fetch().

items:
  - title: Time frames from list mode (dynamic PET)
    issue: 189
    area: PET
    level: intermediate
    why: A dedicated mMR reader is no longer needed. ETSI's STIR2PETSIRD converts mMR list mode to PETSIRD, which io.PET.read_petsird reads (t_PETSIRD does this). What the issue's author needed next was a long scan in time frames, for functional PET.
    data: PET/PETSIRD-mMR-NEMA, a 60-minute mMR scan of a NEMA phantom (its Zenodo record is being published).
    start: io.PET.read_petsird(path, time_interval_s=(start, stop)) reads one frame's events.
    done: A tutorial reconstructs the scan in six 10-minute frames, corrects each for decay, and plots each sphere's activity against time.

  - title: Conjugate-gradient reconstruction
    issue: new
    area: Algorithms
    level: advanced
    why: CG does not force every voxel to stay non-negative the way EM does, which changes bias and noise at low counts.
    data: SPECT/SIMIND-Jaszak, the SIMIND Jaszczak phantom whose true activities are known.
    start: algorithms/preconditioned_gradient_ascent.py, next to OSEM and SART, and likelihoods/mse_objective.py. CGLS and preconditioned CG first, then a penalised variant.
    done: Agrees with scipy.sparse.linalg.cg on an explicit matrix, converges to the least-squares solution on small problems, and reconstructs the Jaszczak phantom. Planned for v4.1.

  - title: Pinhole and multi-pinhole SPECT
    issue: new
    area: SPECT
    level: advanced
    why: Pinhole collimators give a better resolution and sensitivity trade-off for small objects and preclinical work.
    data: STIR's PinholeSPECTUB sample geometry files and simulated projections.
    start: projectors/SPECT/, with SPECTSystemMatrix and StarGuideSystemMatrix as models, and metadata/SPECT/.
    done: Forward projections agree with STIR on the sample geometry, the class passes the system-matrix contract tests (tests/contracts.py), and a tutorial reconstructs a phantom.

  - title: "Low-count bias study: OSEM against CG"
    issue: new
    area: Research
    level: research
    why: Tells users which algorithm to trust for dosimetry at late, low-count time points.
    data: SPECT/SIMIND-Jaszak (Lu-177 and Ac-225), scaled to count levels from clinical down to 1 %, with many Poisson noise realisations at each.
    start: The t_accuracy_known_truth tutorial, which measures bias and noise in each sphere against the truth for OSEM and BSREM. CG comes from the card above.
    done: Bias and ensemble noise per region against counts and iterations, a figure for the docs, and a conference abstract.

  - title: Cascade-gamma (TOF-CGI) PET projector
    issue: new
    area: PET
    level: research
    why: Ac-225 can be imaged on a clinical TOF-PET scanner by detecting its 465 and 1567 keV cascade.
    data: Needs list-mode data, through a collaboration with the authors of the 2026 JNM paper.
    start: projectors/PET/petlm_system_matrix.py (TOF list mode with parallelproj 2) and metadata/PET/pet_tof_metadata.py.
    done: Reproduces the published phantom resolution to within 10%.
