# The images each tutorial exports for the docs' 3D viewer. After a tutorial runs, docs/tools/run_tutorials.py runs
# one more cell in the same kernel (docs/tools/viewer_export.py), which evaluates the expressions below in the
# notebook's own namespace, so no notebook is changed. A tutorial missing here gets no viewer.
#
#   title, description:  shown above the viewer
#   credit:              the data's source and licence, shown with the images
#   setup:               optional Python run first, for imports the expressions need
#   max_mb:              optional size budget (default 15 MB); larger CTs are averaged down to fit. The CT
#                        tutorials raise it to show their reconstructions at full resolution (Luke, 11 Oct 2026)
#   start_voxel:         optional [i, j, k] of the first SPECT or PET layer, as the tutorial indexes its array, where
#                        the viewer opens (default: the hottest spot inside the anatomy)
#   layers:              the images, drawn bottom to top. List every reconstruction the tutorial makes: the viewer's
#                        Image switch moves between them, starting with the first. Each layer has:
#     name:       short name ("CT", "OSEM"), also the file name
#     label:      optional longer name, shown in the picker and the readout
#     kind:       ct (HU) | mr | mu (attenuation map) | spect | pet | image (any other image, in grey)
#     the image, one of:
#     image:      expression for an io.Image, e.g. io.load_image(files_CT): its values, affine and units (a file's
#                 image as PyTomography places it)
#     array:      expression for the 3D image (torch or numpy, axes x, y, z as PyTomography stores them), with
#     affine:     expression for its 4 x 4 voxel-to-patient matrix in LPS mm: object_meta.affine for a reconstruction
#     units:      shown in the readout (an image: layer defaults to the Image's units)
#     colormap, range, opacity, window (ct: phantom | soft | bone | lung | full): display defaults. SPECT and PET
#                 default to inferno from 0 to their hottest voxel inside the anatomy (CT above -500 HU), so a hot
#                 voxel at the edge of the field of view doesn't set the scale. Without an anatomy image, nothing
#                 bounds it: give `range: [0, p99.98]`, a percentile of the image's voxels (any end of a range can be
#                 a number or "p<percentile>").
#     crop:       body (CT default: where the image is above -500 HU, else 2% of its maximum) | base (SPECT and PET
#                 default: the anatomy's extent) | none
#     when:       optional Python condition, checked in the tutorial's namespace; the layer is exported only when it
#                 holds (e.g. while two versions of a tutorial are in flight)
#     scale_group: images in the same units share one colour scale and keep it when the reader switches between
#                 them; give a different name to keep an image apart (e.g. a scanner's image in other units), or none
#     voxel_mm:   average down to about this voxel size, or [x, y, z] (downsample: an integer factor instead);
#     slices:     per-axis "a:b", to keep part of the array
#
# The expressions run in the tutorial's namespace, with io (pytomography.io) and np in it:
#   - {name: OSEM, kind: spect, array: recon, affine: object_meta.affine, units: counts}
#   - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom}
# (Until every entry has moved to that form, the exporter still takes the old one: an array expression that gives a
# tuple (image, affine), `affine_scale: 10` for an affine in cm, and the vx.* affine helpers.)

tutorials:

  # ---------- SPECT ----------
  t_siminddata:
    title: SIMIND Jaszczak phantom
    description: Lu-177, OSEM with attenuation, PSF and scatter
    credit: Monte Carlo data simulated with SIMIND (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: Attenuation, kind: mu, array: amap, affine: object_meta.affine, units: 1/mm}
    - {name: OSEM, kind: spect, array: reconstructed_image, affine: object_meta.affine, units: counts}

  t_dicomdata:
    title: Lu-177 NEMA phantom
    description: OSEM 4 × 8 with attenuation, PSF and scatter, next to the scanner's reconstruction
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: OSEM, label: PyTomography OSEM 4 × 8, kind: spect, array: reconstructed_object, affine: object_meta.affine, units: counts}
    # the scanner's reconstruction, put on our grid by its own header (io.load_image(...).on(object_meta)) in the tutorial
    - {name: Vendor, label: Scanner's reconstruction, kind: spect, array: recon_vendor, affine: object_meta.affine, units: counts}

  t_algorithms:
    title: Lu-177 NEMA phantom, four algorithms
    description: BSREM, OSEM, OSMAPOSL and KEM on the same projections
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: BSREM, kind: spect, array: recon_bsrem, affine: object_meta.affine, units: counts}
    - {name: OSEM, kind: spect, array: recon_OSEM, affine: object_meta.affine, units: counts}
    - {name: OSMAPOSL, kind: spect, array: recon_osmaposl, affine: object_meta.affine, units: counts}
    - {name: KEM, kind: spect, array: recon_kem, affine: object_meta.affine, units: counts}

  t_accuracy_known_truth:
    title: SIMIND phantom with a known activity
    description: OSEM and BSREM next to the true activity they should recover
    credit: Monte Carlo data simulated with SIMIND (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: Attenuation, kind: mu, array: attenuation_map, affine: object_meta.affine, units: 1/mm}
    - {name: OSEM, kind: spect, colormap: pet, array: recon_osem, affine: object_meta.affine, units: counts}
    - {name: BSREM, kind: spect, colormap: pet, array: recon_bsrem, affine: object_meta.affine, units: counts}
    - {name: Truth, label: True activity, kind: spect, colormap: pet, array: truth_image, affine: object_meta.affine, units: MBq/mL}

  t_dicommultibed:
    title: Lu-177-PSMA patient, two bed positions
    description: Both beds reconstructed and stitched into one volume
    credit: GE Discovery patient scan (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: soft, units: HU, voxel_mm: 2}
    - {name: SPECT, label: Stitched OSEM, kind: spect, array: recon_stitched, affine: object_meta_stitched.affine, units: counts}
    - {name: Bed 1, label: Upper bed alone, kind: spect, array: recon_upper, affine: object_meta_upper.affine, units: counts, scale_group: beds}
    - {name: Bed 2, label: Lower bed alone, kind: spect, array: recon_lower, affine: object_meta_lower.affine, units: counts, scale_group: beds}

  t_dualpeak:
    title: Lu-177 NEMA phantom, two photopeaks
    description: One reconstruction from the 113 keV and 208 keV windows together
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: OSEM, label: "OSEM, both photopeaks", kind: spect, array: recon_OSEM, affine: object_meta.affine, units: MBq·s}

  t_uncertainty_spect:
    title: Lu-177-PSMA patient
    description: The two-bed reconstruction whose uncertainty the tutorial estimates
    credit: GE Discovery patient scan (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: soft, units: HU, voxel_mm: 2}
    - {name: SPECT, label: Stitched OSEM, kind: spect, array: reconstructed_image_multibed, affine: object_meta_stitched.affine, units: counts}
    - {name: Bed 2, label: Lower bed alone (the one the uncertainty is for), kind: spect, array: recon_OSEM, affine: object_meta.affine, units: counts}

  t_spect_mc:
    title: SIMIND Jaszczak phantom, Monte Carlo scatter
    description: Scatter estimated by SIMIND inside the reconstruction, next to the analytical model
    credit: Monte Carlo data simulated with SIMIND (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: Attenuation, kind: mu, array: amapIsotopeEnergy, affine: object_meta.affine, units: 1/mm}
    # The Monte Carlo reconstruction is in MBq s (SIMIND's projections are per MBq and second), the analytical one in
    # counts: in their own units, so they don't share one colour scale (on the analytical one's, the MC image was black)
    - {name: MC, label: Monte Carlo scatter, kind: spect, array: recon_MC, affine: object_meta.affine, units: MBq·s}
    - {name: Analytical, label: Analytical scatter, kind: spect, array: recon_analytical, affine: object_meta.affine, units: counts}

  t_spect_mc2:
    title: Lu-177 NEMA phantom, Monte Carlo scatter
    description: Scatter estimated by SIMIND inside the reconstruction of a measured scan
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: MC, label: Monte Carlo scatter, kind: spect, array: recon_MC, affine: object_meta.affine, units: MBq·s}

  t_starguide:
    title: Tc-99m NEMA phantom, GE StarGuide
    description: PyTomography's reconstruction next to the scanner's
    credit: GE StarGuide scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: OSEM, label: PyTomography OSEM, kind: spect, array: recon_pytomography, affine: object_meta.affine, units: counts/s}
    # GE's reconstruction, put on our grid by io.load_image(...).on(object_meta) in the tutorial
    - {name: Vendor, label: Scanner's reconstruction, kind: spect, array: recon_vendor, affine: object_meta.affine, units: scanner units, scale_group: scanner}

  t_ac225_simind_recon:
    title: Ac-225 Jaszczak phantom (SIMIND)
    description: The full PSF model, with penetration and scatter in the collimator, next to a Gaussian PSF
    credit: Monte Carlo data simulated with SIMIND (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: Attenuation, kind: mu, array: amap, affine: object_meta.affine, units: 1/mm}
    - {name: Full PSF, kind: spect, array: recon_1Dfit, affine: object_meta.affine, units: counts}
    - {name: Gaussian PSF, kind: spect, array: reconbad, affine: object_meta.affine, units: counts}

  t_ac225_dicom_recon:
    title: Ac-225 NEMA phantom
    description: The full PSF model on a measured scan, smoothed with a 20 mm Gaussian, and unsmoothed
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: ct, window: phantom, units: HU}
    - {name: Smoothed, label: Smoothed (20 mm FWHM), kind: spect, array: recon_smoothed, affine: object_meta.affine, units: counts}
    - {name: Unsmoothed, kind: spect, array: recon, affine: object_meta.affine, units: counts, scale_group: none}

  t_CardiacReorientation:
    title: Tc-99m myocardial perfusion
    description: The reconstruction before it is turned to the short axis (no CT; no attenuation correction)
    credit: Patient scan (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    # open on the heart, with the tutorial's own scale (vmax=10): a hot spot outside the heart is the hottest voxel
    start_voxel: [40, 40, 37]
    layers:
    - {name: SPECT, label: OSEM, kind: spect, array: recon, affine: object_meta.affine, units: counts, range: [0, 10]}

  t_algorithms_measured:
    title: Lu-177 NEMA phantom, measured, six reconstructions
    description: BSREM, OSEM with and without a post-filter, OSMAPOSL and KEM after 40 iterations, and the scanner's reconstruction
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: BSREM, label: "BSREM, beta 0.1", kind: spect, colormap: pet, array: "recon_bsrem[beta_shown]", affine: object_meta.affine, units: counts}
    - {name: OSEM, label: OSEM 40 × 8, kind: spect, colormap: pet, array: recon_osem, affine: object_meta.affine, units: counts}
    - {name: OSEMfilter, label: "OSEM 40 × 8, 10 mm filter", kind: spect, colormap: pet, array: recon_osem_filtered, affine: object_meta.affine, units: counts}
    - {name: OSMAPOSL, kind: spect, colormap: pet, array: recon_osmaposl, affine: object_meta.affine, units: counts}
    - {name: KEM, kind: spect, colormap: pet, array: recon_kem, affine: object_meta.affine, units: counts}
    # the scanner's reconstruction, put on our grid by its own header (io.load_image(...).on(object_meta)) in the tutorial
    - {name: Vendor, label: Scanner's reconstruction, kind: spect, colormap: pet, array: recon_scanner, affine: object_meta.affine, units: counts}

  t_fbp_spect:
    title: Lu-177 NEMA phantom, filtered back projection
    description: FBP with and without Chang's attenuation correction, next to OSEM with attenuation, PSF and scatter
    credit: Siemens Symbia T2 scan of a NEMA IQ phantom (PyTomography tutorial data, Zenodo 15314460, CC BY 4.0)
    layers:
    - {name: CT, kind: ct, image: io.load_image(files_CT), window: phantom, units: HU}
    - {name: FBPChang, label: "FBP, Chang's attenuation correction", kind: spect, colormap: pet, array: recon_fbp_chang, affine: object_meta.affine, units: counts}
    - {name: FBP, label: "FBP, no attenuation correction", kind: spect, colormap: pet, array: recon_fbp, affine: object_meta.affine, units: counts}
    - {name: OSEM, label: OSEM 4 × 8, kind: spect, colormap: pet, array: recon_osem, affine: object_meta.affine, units: counts}

  # ---------- PET ----------
  t_pet_introduction:
    title: FDG brain phantom (GATE, Siemens mMR)
    description: The same true coincidences reconstructed as list mode and as sinograms, over the phantom's MR
    credit: GATE simulation of the BigBrain FDG phantom (Belzunce and Reader 2020, Zenodo 8045458, CC BY 4.0)
    setup: import os
    layers:
    - {name: MR, kind: mr, array: "vx.nifti_centred(os.path.join(path, 'fdg_pet_phantom_mri.nii.gz'), 2.0)", crop: body, units: a.u.}
    - {name: List mode, kind: pet, array: recon_lm, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Sinogram, kind: pet, array: recon_sino, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: MLEM list mode, kind: pet, array: mlem_lm, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: MLEM sinogram, kind: pet, array: mlem_sino, affine: vx.object_affine(object_meta), units: a.u.}

  t_PETGATE_scat_sino:
    title: FDG brain phantom, sinogram with scatter
    description: Non-TOF sinogram reconstruction with scatter and randoms correction, next to the true coincidences only
    credit: GATE simulation of the BigBrain FDG phantom (Belzunce and Reader 2020, Zenodo 8045458, CC BY 4.0)
    setup: import os
    layers:
    - {name: MR, kind: mr, array: "vx.nifti_centred(os.path.join(path, 'fdg_pet_phantom_mri.nii.gz'), 2.0)", crop: body, units: a.u.}
    - {name: Corrected, label: Scatter and randoms corrected, kind: pet, array: recon_sinogram_noTOF, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Trues, label: True coincidences only, kind: pet, array: recon_primaryonly, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Uncorrected, label: No scatter correction, kind: pet, array: recon_without_scatter_estimation, affine: vx.object_affine(object_meta), units: a.u.}

  t_PETGATE_scat_sinoTOF:
    title: FDG brain phantom, TOF sinogram with scatter
    description: Time-of-flight sinogram reconstruction with TOF scatter estimation
    credit: GATE simulation of the BigBrain FDG phantom (Belzunce and Reader 2020, Zenodo 8045458, CC BY 4.0)
    setup: import os
    layers:
    - {name: MR, kind: mr, array: "vx.nifti_centred(os.path.join(path, 'fdg_pet_phantom_mri.nii.gz'), 2.0)", crop: body, units: a.u.}
    - {name: Corrected, label: Scatter and randoms corrected, kind: pet, array: recon_sinogram_TOF, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Trues, label: True coincidences only, kind: pet, array: recon_primaryonly, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Uncorrected, label: No scatter correction, kind: pet, array: recon_without_scatter_estimation, affine: vx.object_affine(object_meta), units: a.u.}

  t_PETGATE_scat_lm:
    title: FDG brain phantom, list mode with scatter
    description: Non-TOF list-mode reconstruction with scatter and randoms correction
    credit: GATE simulation of the BigBrain FDG phantom (Belzunce and Reader 2020, Zenodo 8045458, CC BY 4.0)
    setup: import os
    layers:
    - {name: MR, kind: mr, array: "vx.nifti_centred(os.path.join(path, 'fdg_pet_phantom_mri.nii.gz'), 2.0)", crop: body, units: a.u.}
    - {name: Corrected, label: Scatter and randoms corrected, kind: pet, array: recon_lm_nontof, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Trues, label: True coincidences only, kind: pet, array: recon_primaryonly, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Uncorrected, label: No scatter correction, kind: pet, array: recon_without_scatter_estimation, affine: vx.object_affine(object_meta), units: a.u.}

  t_PETGATE_scat_lmTOF:
    title: FDG brain phantom, TOF list mode with scatter
    description: Time-of-flight list-mode reconstruction with TOF scatter estimation
    credit: GATE simulation of the BigBrain FDG phantom (Belzunce and Reader 2020, Zenodo 8045458, CC BY 4.0)
    setup: import os
    layers:
    - {name: MR, kind: mr, array: "vx.nifti_centred(os.path.join(path, 'fdg_pet_phantom_mri.nii.gz'), 2.0)", crop: body, units: a.u.}
    - {name: Corrected, label: Scatter and randoms corrected, kind: pet, array: recon_lm_tof, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Trues, label: True coincidences only, kind: pet, array: recon_primaryonly, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: Uncorrected, label: No scatter correction, kind: pet, array: recon_without_scatter_estimation, affine: vx.object_affine(object_meta), units: a.u.}

  t_GE_HDF5:
    title: NEMA IQ phantom, GE Discovery MI
    description: BSREM and OSEM from the scanner's list mode, with time of flight
    credit: GE Discovery MI NEMA scan (Schramm, Zenodo 8404015, CC BY 4.0)
    # No CT here to bound the scale, and BSREM has about 200 hot voxels (up to 2.3) in the first slice of the axial field
    # of view, three times the phantom's hottest sphere (0.52), so its maximum would leave both images almost black. The
    # 99.98th percentile (0.43 for BSREM, 0.44 for OSEM) lies above all but the spheres' hottest voxels.
    layers:
    - {name: BSREM, kind: pet, array: recon_BSREM, affine: vx.object_affine(object_meta), units: a.u., range: [0, p99.98]}
    - {name: OSEM, kind: pet, array: recon_OSEM, affine: vx.object_affine(object_meta), units: a.u., range: [0, p99.98]}

  t_uncertainty_pet:
    title: NEMA IQ phantom, GE Discovery MI
    description: The OSEM reconstruction whose uncertainty the tutorial estimates
    credit: GE Discovery MI NEMA scan (Schramm, Zenodo 8404015, CC BY 4.0)
    layers:
    - {name: OSEM, kind: pet, array: recon_OSEM, affine: vx.object_affine(object_meta), units: a.u.}

  t_PETSIRD:
    title: NEMA IQ phantom, Siemens Biograph mMR (PETSIRD)
    description: List-mode OSEM with and without scatter correction, over the scan's attenuation map
    credit: Siemens Biograph mMR scan of a NEMA IQ phantom (Thomas and Sanderson, UCL; Zenodo 1304454, CC BY-SA 4.0), converted to PETSIRD 0.9.1; these images are CC BY-SA 4.0 too
    layers:
    # All three are on the tutorial's grid, whose axes are LPS turned by info['petsird_alignment_deg'] (0.35 degrees)
    # about the scanner's axis (its grid_affine). The viewer takes only axis-aligned images, so the grid is placed
    # unturned, which moves no voxel of the phantom by more than 1 mm.
    - {name: Attenuation, kind: mu, array: mu_map, affine: vx.object_affine(object_meta), crop: body, units: 1/cm}
    - {name: Scatter corrected, label: "OSEM, scatter and randoms corrected", kind: pet, array: recon_with_scatter, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: No scatter correction, label: "OSEM, randoms corrected, no scatter correction", kind: pet, array: recon_without_scatter, affine: vx.object_affine(object_meta), units: a.u.}

  t_PETGATE_DIP:
    title: FDG brain phantom, Deep Image Prior
    description: The network's image next to TOF list-mode OSEM, over the MR it was conditioned on
    credit: GATE simulation of the BigBrain FDG phantom (Belzunce and Reader 2020, Zenodo 8045458, CC BY 4.0)
    layers:
    # DIP's grid is 1.25 mm (204 x 204 x 154): four PET images on it take about 27 MB, over the 15 MB budget, so they
    # are averaged 2 x 2 x 2 to 2.5 mm, the same grid for all four (about 1 MB each). The MR keeps 1.25 mm.
    - {name: MR, kind: mr, array: mri_aligned, affine: vx.object_affine(object_meta), crop: body, units: a.u.}
    - {name: DIP, label: Deep Image Prior, kind: pet, array: recon_DIP, affine: vx.object_affine(object_meta), voxel_mm: 2.5, units: a.u.}
    - {name: OSEM, label: TOF list-mode OSEM, kind: pet, array: recon_lm_tof, affine: vx.object_affine(object_meta), voxel_mm: 2.5, units: a.u.}
    - {name: OSEM filtered, label: "TOF list-mode OSEM, filtered", kind: pet, array: recon_lm_tof_filtered, affine: vx.object_affine(object_meta), voxel_mm: 2.5, units: a.u.}
    - {name: Uncorrected, label: No scatter correction, kind: pet, array: recon_without_scatter_estimation, affine: vx.object_affine(object_meta), voxel_mm: 2.5, units: a.u.}

  # ---------- CT ----------
  t_CT_GEN3:
    title: Chest CT from raw projections
    description: Our reconstruction of the scanner's raw projections, in HU, beside the scanner's own
    credit: TCIA LDCT-and-Projection-data, case C145 (CC BY 4.0; see TCIA's data usage policy)
    credit_url: https://www.cancerimagingarchive.net/collection/ldct-and-projection-data/
    # Full resolution (Luke, 11 Oct 2026): every image on the grid it was reconstructed on, 0.66 x 0.66 x 1 mm, about
    # 280 MB for the three (each about 150 MB in the reader's memory), so this tutorial's budget is raised
    max_mb: 300
    layers:
    # Our grid in the patient's frame comes from the projections; both FBP images share it. The scanner's own images
    # keep their grid, placed as the tutorial places them for its comparison (scanner_affine: GE's position is the
    # corner of the first pixel), so switching between the images moves nothing.
    - {name: CT, label: FBP, kind: ct, array: hu, affine: "proj_meta.get_patient_affine(object_meta).numpy()", window: soft, units: HU}
    - {name: Matched, label: "FBP, advanced settings", kind: ct, array: hu_matched, affine: "proj_meta.get_patient_affine(object_meta).numpy()", window: soft, units: HU}
    - {name: Scanner, label: Scanner's reconstruction, kind: ct, array: scanner, affine: scanner_affine, window: soft, units: HU}

  t_CT_microct:
    title: Glass beads, cone-beam micro-CT
    description: OS-SART started from FDK, as attenuation per mm
    credit: SophiaBeads Dataset Project (Coban and McDonald 2015, Zenodo 16474, CC BY-SA 4.0); these images are CC BY-SA 4.0 too
    # Full resolution (Luke, 11 Oct 2026): 500 x 500 x 500 voxels of 0.064 mm, about 420 MB for the two (each 250 MB in
    # the reader's memory), so this tutorial's budget is raised
    max_mb: 450
    layers:
    - {name: SART, label: OS-SART, kind: mu, array: recon_sart, affine: "vx.centred(system_matrix.object_meta.dr, recon_sart.shape)", units: 1/mm}
    - {name: FDK, kind: mu, array: recon_fdk, affine: "vx.centred(system_matrix.object_meta.dr, recon_fdk.shape)", units: 1/mm}

  t_fbp_ct:
    title: Chest CT, filtered back projection with two windows
    description: The Hann and Ram-Lak windows, in HU, beside the scanner's own reconstruction
    credit: TCIA LDCT-and-Projection-data, case C145 (CC BY 4.0; see TCIA's data usage policy)
    credit_url: https://www.cancerimagingarchive.net/collection/ldct-and-projection-data/
    # Full resolution, like t_CT_GEN3: every image on the grid it was reconstructed on, 0.66 x 0.66 x 1 mm. The
    # scanner's images keep their own grid, placed with the tutorial's scanner_affine (GE's position is the corner of
    # the first pixel).
    max_mb: 350
    layers:
    - {name: Hann, label: "FBP, Hann", kind: ct, array: hu, affine: ct_affine, window: soft, units: HU}
    - {name: RamLak, label: "FBP, Ram-Lak", kind: ct, array: hu_ramlak, affine: ct_affine, window: soft, units: HU}
    - {name: Scanner, label: Scanner's reconstruction, kind: ct, array: scanner, affine: scanner_affine, window: soft, units: HU}

  # ---------- Building with PyTomography ----------
  t_examplesystemmatrix:
    title: A new system matrix, on 3 × 3 × 3 voxels
    description: OSEM with the tutorial's own list-mode system matrix, with one subset and with two
    credit: Events drawn at random in the tutorial; no external data
    layers:
    # The tutorial's last reconstructions, from its list-mode example (its `recon` has the same settings as
    # recon_1subset). Its voxels are 1.5 units of no stated length, placed here as mm.
    - {name: 1 subset, label: "List-mode OSEM, 1 subset", kind: image, array: recon_1subset, affine: vx.object_affine(object_meta), units: a.u.}
    - {name: 2 subsets, label: "List-mode OSEM, 2 subsets", kind: image, array: recon_2subsets, affine: vx.object_affine(object_meta), units: a.u.}

