<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif"><title>How the proton CT data were made: from a patient CT to the list mode file</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8494"/></marker></defs><rect width="1200" height="520" fill="#000000"/><text x="40.0" y="36.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">How the data were made</text><text x="40.0" y="70.0" font-size="13" fill="#b9bfcc" font-weight="700" text-anchor="start">Simulated with GATE (Monte Carlo)</text><rect x="40" y="82" width="255" height="112" rx="8" fill="#111318" stroke="#7d8494" stroke-width="1.3"/><text x="52.0" y="106.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Patient CT</text><text x="52.0" y="126.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">a 57-slice slab of an adult abdomen</text><text x="52.0" y="142.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">(TCIA PSMA-PET-CT-Lesions), couch</text><text x="52.0" y="158.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">removed, centred on the rotation</text><text x="52.0" y="174.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">axis</text><rect x="328" y="82" width="255" height="112" rx="8" fill="#111318" stroke="#7d8494" stroke-width="1.3"/><text x="340.0" y="106.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Phantom</text><text x="340.0" y="126.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">each voxel a tissue of Schneider et</text><text x="340.0" y="142.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">al.’s table, with its true RSP</text><text x="340.0" y="158.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">(truth_rsp.nii.gz)</text><line x1="295" y1="138" x2="326" y2="138" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="616" y="82" width="255" height="112" rx="8" fill="#111318" stroke="#7d8494" stroke-width="1.3"/><text x="628.0" y="106.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Monte Carlo scan</text><text x="628.0" y="126.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">GATE 10 with Geant4 11.3</text><text x="628.0" y="142.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">(QGSP_BIC_EMY): 360 views of 1.14</text><text x="628.0" y="158.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">million protons</text><line x1="583" y1="138" x2="614" y2="138" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="904" y="82" width="255" height="112" rx="8" fill="#111318" stroke="#7d8494" stroke-width="1.3"/><text x="916.0" y="106.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Detector response</text><text x="916.0" y="126.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">every proton’s hits in the DTC:</text><text x="916.0" y="142.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">clusters in the tracker, energy in</text><text x="916.0" y="158.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">each calorimeter layer</text><line x1="871" y1="138" x2="902" y2="138" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><text x="156.0" y="236.0" font-size="13" fill="#b9bfcc" font-weight="700" text-anchor="start">Converted outside PyTomography: github.com/lukepolson/pct-gate-simulation</text><path d="M1031.5,194 L1031.5,214 L142.0,214 L142.0,248" fill="none" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="250" width="204" height="128" rx="8" fill="#111318" stroke="#ffb547" stroke-width="1.3"/><text x="52.0" y="274.0" font-size="14" fill="#ffb547" font-weight="700" text-anchor="start">Exit and range</text><text x="52.0" y="294.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">exit point and direction</text><text x="52.0" y="310.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">from the 2 tracker layers;</text><text x="52.0" y="326.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">range from a fit to the</text><text x="52.0" y="342.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">hits in the calorimeter</text><rect x="266" y="250" width="204" height="128" rx="8" fill="#111318" stroke="#ffb547" stroke-width="1.3"/><text x="278.0" y="274.0" font-size="14" fill="#ffb547" font-weight="700" text-anchor="start">WEPL</text><text x="278.0" y="294.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">the range made a WEPL by</text><text x="278.0" y="310.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">the DTC’s calibration,</text><text x="278.0" y="326.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">scans of water slabs 0 to</text><text x="278.0" y="342.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">480 mm thick</text><line x1="244" y1="314" x2="264" y2="314" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="492" y="250" width="204" height="128" rx="8" fill="#111318" stroke="#7d8494" stroke-width="1.3"/><text x="504.0" y="274.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">3σ cuts</text><text x="504.0" y="294.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">protons whose WEPL or angle</text><text x="504.0" y="310.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">is more than 3σ from the</text><text x="504.0" y="326.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">mean of their view and 2 mm</text><text x="504.0" y="342.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">entry square are dropped</text><line x1="470" y1="314" x2="490" y2="314" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="718" y="250" width="204" height="128" rx="8" fill="#111318" stroke="#4fc3f7" stroke-width="1.3"/><text x="730.0" y="274.0" font-size="14" fill="#4fc3f7" font-weight="700" text-anchor="start">Entry</text><text x="730.0" y="294.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">the spot’s central ray</text><text x="730.0" y="310.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">combined with the exit</text><text x="730.0" y="326.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">traced back: the most</text><text x="730.0" y="342.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">likely entry, and its</text><text x="730.0" y="358.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">spread</text><line x1="696" y1="314" x2="716" y2="314" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="944" y="250" width="204" height="128" rx="8" fill="#111318" stroke="#7d8494" stroke-width="1.3"/><text x="956.0" y="274.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">List mode file</text><text x="956.0" y="294.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">188.6 million protons, 7.5</text><text x="956.0" y="310.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">GB; this tutorial reads a</text><text x="956.0" y="326.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">quarter of them: 47.2</text><text x="956.0" y="342.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">million, 1.9 GB</text><line x1="922" y1="314" x2="942" y2="314" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><text x="1046.0" y="396.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="middle">Zenodo, doi:10.5281/zenodo.23815070</text><path d="M1046.0,404 L1046.0,428" fill="none" stroke="#7d8494" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="430" width="1108" height="62" rx="8" fill="#111318" stroke="#ffffff" stroke-width="1.3"/><text x="52.0" y="455.0" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">PyTomography: this tutorial</text><text x="52.0" y="476.0" font-size="12" fill="#b9bfcc" font-weight="400" text-anchor="start">io.PCT.load_listmode → filtered back projection in two passes → SART along curved paths → the RSP image, against the true RSP and the organs</text></svg>