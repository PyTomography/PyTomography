<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif"><title>How the proton CT data were made: from a patient CT to the list mode file</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8494"/></marker></defs><rect width="1200" height="640" fill="#000000"/><text x="40.0" y="44.0" font-size="26" fill="#ffffff" font-weight="700" text-anchor="start">How the data were made</text><text x="40.0" y="84.0" font-size="16" fill="#b9bfcc" font-weight="700" text-anchor="start">Simulated with GATE (Monte Carlo)</text><rect x="40" y="98" width="258" height="150" rx="9" fill="#111318" stroke="#7d8494" stroke-width="1.4"/><text x="53.0" y="126.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">Patient CT</text><text x="53.0" y="150.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">a 57-slice slab of an adult</text><text x="53.0" y="170.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">abdomen (TCIA</text><text x="53.0" y="190.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">PSMA-PET-CT-Lesions), couch</text><text x="53.0" y="210.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">removed</text><rect x="328" y="98" width="258" height="150" rx="9" fill="#111318" stroke="#7d8494" stroke-width="1.4"/><text x="341.0" y="126.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">Phantom</text><text x="341.0" y="150.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">each voxel a tissue of</text><text x="341.0" y="170.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">Schneider et al.’s table, with</text><text x="341.0" y="190.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">its true RSP</text><text x="341.0" y="210.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">(truth_rsp.nii.gz)</text><line x1="298" y1="173" x2="326" y2="173" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><rect x="616" y="98" width="258" height="150" rx="9" fill="#111318" stroke="#7d8494" stroke-width="1.4"/><text x="629.0" y="126.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">Monte Carlo scan</text><text x="629.0" y="150.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">GATE 10, Geant4 11.3: 360</text><text x="629.0" y="170.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">views of 1.14 million protons</text><text x="629.0" y="190.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">each</text><line x1="586" y1="173" x2="614" y2="173" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><rect x="904" y="98" width="258" height="150" rx="9" fill="#111318" stroke="#7d8494" stroke-width="1.4"/><text x="917.0" y="126.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">Detector response</text><text x="917.0" y="150.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">every proton’s hits in the</text><text x="917.0" y="170.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">DTC: tracker clusters, energy</text><text x="917.0" y="190.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">in each calorimeter layer</text><line x1="874" y1="173" x2="902" y2="173" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1033.0,248 L1033.0,274 L145.0,274 L145.0,318" fill="none" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><text x="161.0" y="306.0" font-size="16" fill="#b9bfcc" font-weight="700" text-anchor="start">Converted outside PyTomography: github.com/lukepolson/pct-gate-simulation</text><rect x="40" y="320" width="210" height="192" rx="9" fill="#111318" stroke="#ffb547" stroke-width="1.4"/><text x="53.0" y="348.0" font-size="18" fill="#ffb547" font-weight="700" text-anchor="start">Exit and range</text><text x="53.0" y="372.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">exit point and direction</text><text x="53.0" y="392.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">from the 2 tracker</text><text x="53.0" y="412.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">layers; range from a fit</text><text x="53.0" y="432.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">to the calorimeter’s</text><text x="53.0" y="452.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">hits</text><rect x="268" y="320" width="210" height="192" rx="9" fill="#111318" stroke="#ffb547" stroke-width="1.4"/><text x="281.0" y="348.0" font-size="18" fill="#ffb547" font-weight="700" text-anchor="start">WEPL</text><text x="281.0" y="372.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">the range made a WEPL by</text><text x="281.0" y="392.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">the DTC’s calibration:</text><text x="281.0" y="412.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">water slabs 0 to 480 mm</text><text x="281.0" y="432.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">thick</text><line x1="250" y1="416" x2="266" y2="416" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><rect x="496" y="320" width="210" height="192" rx="9" fill="#111318" stroke="#7d8494" stroke-width="1.4"/><text x="509.0" y="348.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">3σ cuts</text><text x="509.0" y="372.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">protons more than 3σ</text><text x="509.0" y="392.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">from the mean WEPL or</text><text x="509.0" y="412.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">angle of their view and</text><text x="509.0" y="432.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">2 mm entry square are</text><text x="509.0" y="452.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">dropped</text><line x1="478" y1="416" x2="494" y2="416" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><rect x="724" y="320" width="210" height="192" rx="9" fill="#111318" stroke="#4fc3f7" stroke-width="1.4"/><text x="737.0" y="348.0" font-size="18" fill="#4fc3f7" font-weight="700" text-anchor="start">Entry</text><text x="737.0" y="372.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">the spot’s central ray</text><text x="737.0" y="392.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">combined with the exit</text><text x="737.0" y="412.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">traced back: the most</text><text x="737.0" y="432.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">likely entry, and its</text><text x="737.0" y="452.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">spread</text><line x1="706" y1="416" x2="722" y2="416" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><rect x="952" y="320" width="210" height="192" rx="9" fill="#111318" stroke="#7d8494" stroke-width="1.4"/><text x="965.0" y="348.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">List mode file</text><text x="965.0" y="372.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">188.6 million protons,</text><text x="965.0" y="392.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">7.5 GB; this tutorial</text><text x="965.0" y="412.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">reads a quarter of them:</text><text x="965.0" y="432.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">47.2 million, 1.9 GB</text><line x1="934" y1="416" x2="950" y2="416" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><text x="1162.0" y="536.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="end">Zenodo, doi:10.5281/zenodo.23815070</text><path d="M1057.0,546 L1057.0,546" fill="none" stroke="#7d8494" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="548" width="1122" height="76" rx="9" fill="#111318" stroke="#ffffff" stroke-width="1.4"/><text x="53.0" y="578.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">PyTomography: this tutorial</text><text x="53.0" y="604.0" font-size="16" fill="#b9bfcc" font-weight="400" text-anchor="start">io.PCT.load_listmode → filtered back projection in two passes → SART along curved paths → the RSP image, against the true RSP and the organs</text></svg>